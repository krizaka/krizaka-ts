packages:
  - "packages/*"

# pnpm 10 runs no install scripts unless allowed: esbuild (tsup) needs its binary check.
onlyBuiltDependencies:
  - esbuild

# Security pins for vulnerable transitive deps that Dependabot cannot move (a parent pins the major).
overrides:
  "minimatch@>=7.0.0 <11.0.1": "11.0.4" # GHSA-g3hv-75wg-m249: no fix before 11 (via eslint, typescript-eslint)

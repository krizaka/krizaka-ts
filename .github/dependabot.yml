# Dependabot: the Krizaka model (monthly, ONE grouped pull request per ecosystem; krizaka/.github#510 cap of 3 open PRs).
# `all` takes every update, majors and workflow pins included, so a run never opens a PR per dependency.
# Security fixes stay on and arrive grouped apart. Auto-merge is the shared workflow of krizaka/.github (minor and patch, CI green).
# The ignore rules below are decisions, not oversights.
version: 2
updates:

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Node majors are a decision, not a bump: LTS only (22/24), moved by hand
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=25"]
      # TypeScript 7 / ESLint 10 only once @krizaka/config supports them (krizaka/krizaka-ui#141)
      - dependency-name: "typescript"
        versions: [">=6"]
      - dependency-name: "eslint"
        versions: [">=10"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["area:deps"]
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

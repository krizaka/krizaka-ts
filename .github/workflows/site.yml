# The documentation site (site/, ts.krizaka.com): lint, tests and the static build on every change to what it documents or to
# the site. The deployment is DigitalOcean App Platform's (.do/app.yaml): it rebuilds and publishes on every push to main.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", "packages/**", "README.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "packages/**", "README.md", ".github/workflows/site.yml"]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # the site reads npm: build it weekly too, so a broken read is seen before a release needs it

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    name: Static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run gen
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Every package has its page in out/
        run: |
          for p in start auth settings api-keys webhooks organize brief; do
            test -f out/$p/index.html && test -f out/fr/$p/index.html
          done
          test -f out/index.html && test -f out/fr/index.html && test -f out/llms.txt && test -f out/sitemap.xml
      - name: SEO family contract (robots, AI crawlers, sitemap, llms.txt, canonical, JSON-LD back to Krizaka)
        run: |
          python3 -m http.server 3000 --directory out >/dev/null 2>&1 &
          sleep 2
          node scripts/check-seo-family.mjs --base http://localhost:3000 --host https://ts.krizaka.com --types WebSite,SoftwareSourceCode --limit 60
      - name: No horizontal overflow (360 to 1440 px, both languages, both themes)
        run: |
          npm install --ignore-scripts --no-save --no-audit --no-fund playwright@1.56.1
          node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 3100 --directory out >/dev/null 2>&1 &
          sleep 2
          node scripts/check-overflow.mjs --base http://localhost:3100

# The documentation site (site/, ts.krizaka.com): lint, tests, the static build and its browser checks on every pull request and in the
# merge queue; on main the same build is published to GitHub Pages by the shared workflow (krizaka-internal#4149). The DNS still points
# at DigitalOcean (.do/app.yaml) until the cut-over; post-deploy.yml checks the Pages copy meanwhile.
name: Docs site

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1" # the site reads npm: build it weekly too, so a broken read is seen before a release needs it

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Static site
    uses: krizaka/.github/.github/workflows/pages-site.yml@765d08535145b800cb9db2dbb118588c764313da # main
    permissions:
      contents: read
      pages: write # deploys to GitHub Pages
      id-token: write # OIDC token the deployment or publish needs
    with:
      working-directory: site
      output-dir: site/out
      cname: ts.krizaka.com
      timeout-minutes: 25
      test-command: |
        npm run lint
        npm test
      # The build, then the checks that need the built site: the SEO family contract, and no horizontal overflow
      # (360 to 1440 px, both languages, both themes; it also measures the home's hero).
      build-command: |
        npm run build
        python3 -m http.server 3000 --directory out >/dev/null 2>&1 &
        seo=$!
        python3 -m http.server 3100 --directory out >/dev/null 2>&1 &
        overflow=$!
        trap 'kill "$seo" "$overflow" 2>/dev/null || true' EXIT
        sleep 2
        node ../packages/config/bin/krizaka-seo-family.mjs --base http://localhost:3000 --host https://ts.krizaka.com --types WebSite,SoftwareSourceCode --limit 60
        npm install --ignore-scripts --no-save --no-audit --no-fund playwright@1.64.1
        node_modules/.bin/playwright install --with-deps chromium
        node scripts/check-overflow.mjs --base http://localhost:3100
      expect-files: |
        index.html
        fr/index.html
        llms.txt
        sitemap.xml
        start/index.html
        fr/start/index.html
        auth/index.html
        fr/auth/index.html
        settings/index.html
        fr/settings/index.html
        api-keys/index.html
        fr/api-keys/index.html
        webhooks/index.html
        fr/webhooks/index.html
        organize/index.html
        fr/organize/index.html
        brief/index.html
        fr/brief/index.html

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the pnpm cache, parallel legs, the
  # timeouts and the gate that always reports live there. This file says only what is Krizaka TS's.
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@bd1c2fb5d8c5dba238ab287767d1c28af48ca569 # main (fix-needs-guard, light Sonar scan)
    permissions:
      contents: read
    with:
      duplication: true      # jscpd + dup-ratchet.json: duplicated lines may only go down
      sonar-coverage-paths: packages/*/coverage/lcov.info   # each package writes its own report (vitest run --coverage); the collect step rebases the SF: paths to the repository root
      package-manager: pnpm
      sonar: true            # CI analysis: the merge queue's branch (gh-readonly-queue/...) is analysed too; automatic analysis never does
      parallel: true
      typecheck-script: typecheck
      postgres-image: postgres:16
      postgres-name: organize_db
      # Test values only — no real secret anywhere.
      env: |
        DATABASE_URL=postgresql://organize_db:ci-only-password@localhost:5432/organize_db
        ORGANIZE_DB_IT=1
        STORAGE_S3_IT=1
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

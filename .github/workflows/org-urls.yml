# The org JSON's URLs still answer, watched daily (krizaka-internal#3669). It was a unit test that fetched every one of them one after
# another: a third party's 502 or a slow network failed every push and took a PR out of the merge queue. Now this watch asks them in
# parallel (bounded, a timeout per URL, one retry) and keeps ONE alert `org-urls/<host>` per host in the private krizaka-internal,
# naming the dead URLs (or commenting on the open one); green closes it. Never required, so it cannot block a merge.
name: Org URLs

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Ask every URL of the org JSON
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.watch.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @krizaka/org...
      - run: pnpm --filter @krizaka/org build
      - id: watch
        run: node scripts/org-urls-watch.mjs "$RUNNER_TEMP/org-urls.json"

  alert:
    name: Alert ${{ matrix.host }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - name: Write the alert body
        env:
          BODY: ${{ matrix.body }}
        run: printf '%s\n' "$BODY" > "$RUNNER_TEMP/org-urls-body.md"
      - name: Raise the alert (dead URLs) or clear it
        uses: krizaka/.github/actions/alert-issue@84a22e72359caf315d8bf346f4a31cdb22f25997 # main (the alert-issue action, as stale-videos)
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          title: "krizaka-ts · fix(org): URLs of the org JSON on ${{ matrix.host }} do not answer"
          body-file: ${{ runner.temp }}/org-urls-body.md
          labels: repo:krizaka-ts,type:fix
          alert-key: org-urls/${{ matrix.host }}
          state: ${{ matrix.state }}

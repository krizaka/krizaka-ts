    # generated:end
  lib-allow:
    kind: comment
    regex: lib-allow:\s*\S
rule:
  any:
    - kind: function_declaration
      has:
        field: name
        matches: lib-name
    - kind: class_declaration
      has:
        field: name
        matches: lib-name
    - kind: interface_declaration
      has:
        field: name
        matches: lib-name
    - kind: type_alias_declaration
      has:
        field: name
        matches: lib-name
    - kind: variable_declarator
      has:
        field: name
        matches: lib-name
      inside:
        kind: lexical_declaration
        stopBy: neighbor
  not:
    any:
      # `// lib-allow: reason` before the declaration, or before the `export` / `const` that holds it.
      - follows:
          matches: lib-allow
          stopBy: neighbor
      - inside:
          any:
            - kind: export_statement
            - kind: lexical_declaration
          follows:
            matches: lib-allow
            stopBy: neighbor
          stopBy:
            not:
              any:
                - kind: export_statement
                - kind: lexical_declaration
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"

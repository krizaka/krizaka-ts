id: no-local-lib-copy
language: Tsx
severity: error
message: "No local copy of a @krizaka package export: this name is exported by one of the packages of krizaka-ts (`createOutbox`, `OrganizeError`, `memoryNotificationStore`…). Import it from `@krizaka/<package>`; a function that implements the package's port under the same name takes a written reason: `// lib-allow: <reason>` on the line above."
note: "krizaka-internal#3582: apps re-wrote what the packages already provide. The names are generated from the exports of the packages of krizaka-ts (`pnpm run gen:package-exports`), never typed by hand; only distinctive names count (two words at least, 8 characters), so `Query` or `Clock` stay free. The `app` set is for an app that consumes the packages: krizaka-ts itself, where they are defined, does not adopt it."
utils:
  lib-name:
    # generated:begin — `pnpm run gen:package-exports`, from the exports of the @krizaka packages
    regex: ^(AccountDeps|AccountError|AccountProfile|AccountService|accountsMigration|accountsSchema|ActionDefaults|ActionLimit|AdapterInput|addHours|addMinutes|addMoney|addSeconds|AdminDecision|AdminGateInput|AdminRefusal|adoptMigration|adoptPaymentEventsSql|allowedIps|announcePayment|ApiKeyCode|ApiKeyError|ApiKeyRecord|ApiKeyRules|apiKeysMigration|apiKeysSchema|ApiKeyStore|apiKeyStoreContract|ApiKeyView|AppConfig|AppEnvironment|ApplyInput|applyOnce|applyOnceInTransaction|ApplyOptions|appSchema|assertCharge|assertContract|assertEmbedded|assertKey|assertModules|assertTenantId|assertTerms|assertTrial|assertUpgrade|AssessmentInput|AuditCode|auditContributor|AuditDeps|AuditEntry|AuditEntryInput|AuditError|AuditFilters|AuditInsert|AuditNote|AuditPort|auditSchema|auditSettings|AuditStore|auditStoreContract|AuditTrail|authSettings|AvatarImageError|AvatarProcessor|AvatarRules|backoffSeconds|bareAddress|BrandKind|BriefAction|BriefError|BriefWeek|BucketHit|bucketStore|BucketStoreOptions|byPriority|castMedia|CastPersona|CastProduct|CastRole|CatalogObject|CataloguePlan|catalogueValues|CategoryDeclaration|CategoryDefaults|categoryOf|ChargeRequest|ChargeResult|checkAddress|CheckCategory|checkConfig|checkEndpoint|checkEndpointDns|checkFilters|checkInput|checkKindConfig|checkMessage|checkMove|CheckOutcome|CheckoutContext|CheckoutRequest|checkPurpose|CheckPurposeKey|CheckRefusal|CheckResult|checkRetention|checkSettings|checkStatusSet|checkSubject|CheckSubject|checksumOf|checkViewFilters|CircuitOptions|ClaimOptions|cleanDescription|cleanName|clearedSessionCookie|clientIp|ClientIpRules|ClosableStream|cloudConnector|CloudConnector|CloudConnectorName|CloudKeyConfig|cloudKeyService|CodeNameHit|codeNameMap|CodeStore|codeStoreContract|CollectCheckInput|compareVersions|CompleteOptions|composeBrief|ComposedModule|ComposeInput|ConnectAccountStatus|connectAdapter|ConnectAdapterConfig|ConnectEvent|ConnectHandlers|connectionAccessToken|ConnectionTokens|ConnectorApp|ConnectorOverride|ConnectOutc
id: no-hand-written-validation-regex
valid:
  - |
    const words = text.split(/\s+/);
  - |
    const clean = value.replace(/[^a-z]/g, "");
  - |
    if (!isIsoDate(date)) { fail(); }
invalid:
  - |
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date ?? "")) { fail(); }
  - |
    const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  - |
    const u = /^https?:\/\//.test(value);
  - |
    const s = /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(value);

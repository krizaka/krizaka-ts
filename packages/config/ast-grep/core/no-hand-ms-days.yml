id: no-hand-ms-days
language: Tsx
severity: error
message: "Hand-written time arithmetic (`n * 24 * 60 * 60 * 1000`). Use date-fns `hoursToMilliseconds(n * 24)` (date-fns has no days helper), or read the duration from the settings (parameters-from-DB rule)."
note: "Codemod: `npm run sg:fix`. Behaviour is identical."
rule:
  pattern: $N * 24 * 60 * 60 * 1000
fix: hoursToMilliseconds($N * 24)
ignores: &ignores
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/*.test.ts"
  - "**/__tests__/**"
  - "**/tests/**"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "e2e/**"
  - "scripts/**"
  - "**/scripts/**"

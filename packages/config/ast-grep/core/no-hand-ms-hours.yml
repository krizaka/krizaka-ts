id: no-hand-ms-hours
language: Tsx
severity: error
message: "Hand-written time arithmetic (`n * 60 * 60 * 1000`). Use date-fns `hoursToMilliseconds(n)`, or read the duration from the settings."
note: "Codemod: `npm run sg:fix`. Behaviour is identical."
rule:
  pattern: $N * 60 * 60 * 1000
  not:
    pattern: $M * 24 * 60 * 60 * 1000
fix: hoursToMilliseconds($N)
ignores:
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/*.test.ts"
  - "**/__tests__/**"
  - "**/tests/**"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "e2e/**"
  - "scripts/**"
  - "**/scripts/**"

id: no-fail-open-secret
language: Tsx
severity: error
message: "A secret read as `process.env.X ?? \"\"` or `|| \"\"` turns a missing value into an empty string, and the check that needed it passes without proof (ADR-022, krizaka-internal#1972). Read it with a guard that throws and names the variable (never its value), or declare the job's secrets in the `require-secrets` action."
rule:
  any:
    - pattern: process.env.$NAME ?? ""
    - pattern: process.env.$NAME ?? ''
    - pattern: process.env.$NAME || ""
    - pattern: process.env.$NAME || ''
    - pattern: process.env["$NAME"] ?? ""
    - pattern: process.env["$NAME"] || ""
constraints:
  NAME:
    regex: "(KEY|TOKEN|SECRET|PASSWORD|PASSWD|CREDENTIAL)"
files:
  - "scripts/**"
  - "tools/**"
  - "tests/**"
  - "test/**"
  - "e2e/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.mjs"
  - "**/*.spec.ts"
  - "**/*.mjs"
ignores:
  - "**/node_modules/**"
  - "**/dist/**"
